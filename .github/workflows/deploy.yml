name: Deploy to Production

on:
    push:
        branches: [ master ]

env:
    NODE_VERSION: 24.x

jobs:
    deploy:
        runs-on: ubuntu-latest

        steps:
            -   name: Checkout Repository
                uses: actions/checkout@v3

            -   name: Setup Node.js Environment
                uses: actions/setup-node@v3
                with:
                    node-version: ${{ env.NODE_VERSION }}
                    cache: 'npm'

            -   name: Create .env.production file
                run: |
                    echo "VITE_APP_BASE_URL=${{ env.VITE_APP_BASE_URL }}" >> .env.production
                    # Identifiants OAuth : publics, donc des variables de dépôt et non des
                    # secrets. À créer dans Settings > Secrets and variables > Actions > Variables.
                    # Les clés sont déjà présentes (vides) dans le .env.production versionné :
                    # on les remplace au lieu d'ajouter des doublons.
                    sed -i "s|^VITE_GOOGLE_CLIENT_ID=.*|VITE_GOOGLE_CLIENT_ID=${{ vars.VITE_GOOGLE_CLIENT_ID }}|" .env.production
                    sed -i "s|^VITE_APPLE_SERVICES_ID=.*|VITE_APPLE_SERVICES_ID=${{ vars.VITE_APPLE_SERVICES_ID }}|" .env.production
                    # Clé publique VAPID : publique elle aussi, même traitement.
                    sed -i "s|^VITE_VAPID_PUBLIC_KEY=.*|VITE_VAPID_PUBLIC_KEY=${{ vars.VITE_VAPID_PUBLIC_KEY }}|" .env.production

            -   name: Install Dependencies
                run: npm ci

            -   name: Build for Production
                run: npm run build

            -   name: Deploy to Server
                uses: up9cloud/action-rsync@master
                env:
                    HOST: ${{ secrets.SSH_HOST }}
                    USER: ${{ secrets.SSH_USER }}
                    KEY: ${{secrets.SSH_PRIVATE_KEY}}
                    PORT: ${{ secrets.DEPLOY_PORT }}
                    SOURCE: ./dist/
                    TARGET: ${{ secrets.DEPLOY_PATH }}
